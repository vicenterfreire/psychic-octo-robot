name: elite-dev-challenge

services:
  postgres:
    image: docker.io/library/postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elite_dev}
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://elite:elite@postgres:5432/${POSTGRES_DB:-elite_dev}
      FRONTEND_ORIGIN: http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-5173}
      SESSION_COOKIE_SECURE: "false"
    command:
      - /bin/sh
      - -c
      - >-
        alembic upgrade head &&
        python -m backend.database.seed &&
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:${BACKEND_PORT:-8000}/api
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

volumes:
  postgres_data:
